#
# Checks that PicSync builds the way F-Droid builds it: Qt and OpenSSL from
# the pinned submodules (tools/build-android-from-source.sh), a plain Gradle
# instead of the Gradle wrapper, no prebuilt Qt.

name: F-Droid build check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.gitmodules'
      - '3rdparty/**'
      - 'src/**'
      - '*.pro'
      - '*.pri'
      - '.github/workflows/fdroid-check.yml'

permissions:
  contents: write

jobs:
  from-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build qt6-l10n-tools
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Use a plain Gradle like F-Droid
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Submodule versions
        id: subs
        run: echo "key=$(git submodule status | sha1sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache Qt and OpenSSL builds
        uses: actions/cache@v6
        with:
          path: |
            build-fromsource/qt-host
            build-fromsource/qt-android
            build-fromsource/openssl
          key: fromsource-${{ steps.subs.outputs.key }}
          restore-keys: fromsource-${{ steps.subs.outputs.key }}

      - name: Build from source
        run: |
          WORK="$PWD/build-fromsource" PICSYNC_GRADLE=gradle \
            LRELEASE=/usr/lib/qt6/bin/lrelease tools/build-android-from-source.sh

      - name: Inspect APK
        run: |
          ls -la build-fromsource/PicSync-release-unsigned.apk
          unzip -l build-fromsource/PicSync-release-unsigned.apk | grep -E "lib/|AndroidManifest"

      - name: Sign with a throwaway key for testing
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -alias test -keyalg RSA \
            -keysize 2048 -validity 1 -storepass testtest -keypass testtest -dname "CN=test"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" sign --ks "$RUNNER_TEMP/test.jks" \
            --ks-pass pass:testtest --out PicSync.apk build-fromsource/PicSync-release-unsigned.apk

      - name: Hand the APK to the emulator job
        uses: actions/upload-artifact@v7
        with:
          name: from-source-apk
          path: PicSync.apk
          retention-days: 3

  emulator:
    needs: from-source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: from-source-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the UI check with the from-source APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: sh .github/scripts/ui-check.sh

      - name: Publish screenshots to the ui-check-fromsource branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b ui-check-fromsource
          git config user.name "PicSync CI"
          git config user.email "ci@users.noreply.github.com"
          echo "From-source UI check, run ${{ github.run_id }}" > README.txt
          git add -A
          git commit -q -m "From-source UI check ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ui-check-fromsource
