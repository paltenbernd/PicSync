#
# Checks that PicSync builds the way F-Droid builds it: Qt and OpenSSL from
# the pinned submodules (tools/build-android-from-source.sh), a plain Gradle
# instead of the Gradle wrapper, no prebuilt Qt.

name: F-Droid build check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.gitmodules'
      - '3rdparty/**'
      - 'src/**'
      - '*.pro'
      - '*.pri'
      - '.github/workflows/fdroid-check.yml'

permissions:
  contents: read

jobs:
  from-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build qt6-l10n-tools
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Use a plain Gradle like F-Droid
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Submodule versions
        id: subs
        run: echo "key=$(git submodule status | sha1sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache Qt and OpenSSL builds
        uses: actions/cache@v6
        with:
          path: |
            build-fromsource/qt-host
            build-fromsource/qt-android
            build-fromsource/openssl
          key: fromsource-${{ steps.subs.outputs.key }}-${{ hashFiles('tools/build-android-from-source.sh') }}

      - name: Build from source
        run: |
          WORK="$PWD/build-fromsource" PICSYNC_GRADLE=gradle \
            LRELEASE=/usr/lib/qt6/bin/lrelease tools/build-android-from-source.sh

      - name: Inspect APK
        run: |
          ls -la build-fromsource/PicSync-release-unsigned.apk
          unzip -l build-fromsource/PicSync-release-unsigned.apk | grep -E "lib/|AndroidManifest"
