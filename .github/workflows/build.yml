#
# Builds PicSync: first the unit tests on Linux (a failing test stops the
# pipeline), then the Android APK for arm64 (Fairphone 6). Every push to
# main publishes the APK as the latest GitHub release:
#   https://github.com/paltenbernd/PicSync/releases/latest/download/PicSync.apk
#
# Release signing uses these repository secrets (Settings > Secrets > Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD password of keystore and key
#   ANDROID_KEY_ALIAS         key alias (picsync)
# Without them a debug-signed APK is built.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: 6.8.3
  NDK_VERSION: 26.1.10909125
  ANDROID_PLATFORM: android-34

jobs:
  tests:
    name: Unit tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Build app and tests (tests run right after linking)
        run: |
          mkdir build && cd build
          qmake ../PicSync.pro CONFIG+=release
          make -j"$(nproc)"

      - name: Run unit tests again with JUnit output
        run: |
          cd build/tests
          for t in tst_*; do
            "./$t/$t" -o "$PWD/$t.xml,junitxml" -o -,txt
          done

      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/tests/*.xml

  android:
    name: Android APK (arm64)
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Qt for Android (plus the matching desktop host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          cache: true

      - name: Install Android NDK and platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "platforms;$ANDROID_PLATFORM" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Fetch OpenSSL for Android (needed for HTTPS)
        run: |
          git clone --depth 1 https://github.com/KDAB/android_openssl.git "$RUNNER_TEMP/android_openssl"
          echo "ANDROID_OPENSSL_DIR=$RUNNER_TEMP/android_openssl" >> "$GITHUB_ENV"

      - name: Build native code
        run: |
          mkdir build-android && cd build-android
          "$QT_ROOT_DIR/bin/qmake" ../PicSync.pro -spec android-clang \
              ANDROID_ABIS=arm64-v8a CONFIG+=release \
              ANDROID_VERSION_CODE=${{ github.run_number }}
          make -j"$(nproc)"
          make -C src/app INSTALL_ROOT="$PWD/android-build" install

      - name: Package and sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd build-android
          HOST_QT="$(dirname "$QT_ROOT_DIR")/gcc_64"
          DEPLOY="$HOST_QT/bin/androiddeployqt"
          SETTINGS=$(ls src/app/android-*-deployment-settings.json)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/picsync.jks"
            "$DEPLOY" --input "$SETTINGS" --output "$PWD/android-build" \
              --android-platform "$ANDROID_PLATFORM" --jdk "$JAVA_HOME" --gradle --release \
              --sign "$RUNNER_TEMP/picsync.jks" "$KEY_ALIAS" \
              --storepass "$KEYSTORE_PASSWORD" --keypass "$KEYSTORE_PASSWORD"
            APK=$(ls android-build/build/outputs/apk/release/*-signed.apk | head -1)
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets configured - building a debug-signed APK."
            "$DEPLOY" --input "$SETTINGS" --output "$PWD/android-build" \
              --android-platform "$ANDROID_PLATFORM" --jdk "$JAVA_HOME" --gradle
            APK=$(ls android-build/build/outputs/apk/debug/*.apk | head -1)
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          fi
          cp "$APK" "$GITHUB_WORKSPACE/PicSync.apk"
          ls -la "$GITHUB_WORKSPACE/PicSync.apk"
          # Fail if HTTPS support is missing from the package.
          unzip -l "$GITHUB_WORKSPACE/PicSync.apk" | grep -q "libssl_3.so"

      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicSync-apk
          path: PicSync.apk

      - name: Publish as latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PicSync build ${{ github.run_number }}
          body: |
            Automatic build of commit ${{ github.sha }} (${{ env.SIGNING }} signed).
            Install: open PicSync.apk on the Fairphone and allow installation from this source.
          files: PicSync.apk
          make_latest: true
