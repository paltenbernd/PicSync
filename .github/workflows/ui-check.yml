#
# Runs the latest released APK (or the APK of a given release tag) on an
# Android emulator and records screenshots of the settings page while typing
# and scrolling. Start it manually under Actions > UI check > Run workflow.

name: UI check

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (empty = latest)
        required: false
        default: ''
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  emulator:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            gh release download "${{ github.event.inputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern PicSync.apk
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern PicSync.apk
          fi
          ls -la PicSync.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI check on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: sh .github/scripts/ui-check.sh

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-check-screenshots
          path: shots/

      - name: Publish screenshots to the ui-check branch
        if: always()
        run: |
          cd shots
          git init -q -b ui-check
          git config user.name "PicSync CI"
          git config user.email "ci@users.noreply.github.com"
          echo "UI check of ${{ github.event.inputs.tag || 'latest release' }}, run ${{ github.run_id }}" > README.txt
          git add -A
          git commit -q -m "UI check run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ui-check
