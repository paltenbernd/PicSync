Categories:
  - Cloud Storage & File Sync
License: GPL-3.0-or-later
AuthorName: Peter Altenbernd
SourceCode: https://github.com/paltenbernd/PicSync
IssueTracker: https://github.com/paltenbernd/PicSync/issues

AutoName: PicSync

RepoType: git
Repo: https://github.com/paltenbernd/PicSync.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 20e77e7680e40f223bd4ff57fc705e361314c895
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y cmake ninja-build perl python3 openjdk-17-jdk-headless
        qt6-l10n-tools
    output: build-fromsource/PicSync-release-unsigned.apk
    build:
      - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - export ANDROID_SDK_ROOT=$$SDK$$ ANDROID_NDK_ROOT=$$NDK$$
      - export WORK=$PWD/build-fromsource PICSYNC_GRADLE=gradle
      - tools/build-android-from-source.sh
    ndk: r26b

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: common.pri|PICSYNC_VERSION_CODE\s*=\s*(\d+)|.|PICSYNC_VERSION\s*=\s*([\d.]+)
CurrentVersion: 1.0.0
CurrentVersionCode: 1
